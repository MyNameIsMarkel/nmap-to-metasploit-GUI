<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="ar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bdbdbd"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#2b2b2b" stroke-width="1"/>

  <!-- Nodo origen (radar/nmap): círculo con barrido -->
  <g transform="translate(74 128)">
    <circle r="34" fill="none" stroke="#f4f4f4" stroke-width="6" opacity="0.9"/>
    <circle r="20" fill="none" stroke="#f4f4f4" stroke-width="4" opacity="0.5"/>
    <circle r="5" fill="#ffffff"/>
    <path d="M0 0 L30 -16" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Flecha de correlación -->
  <g stroke="url(#ar)" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M116 128 L144 128"/>
    <path d="M132 114 L148 128 L132 142"/>
  </g>

  <!-- Diana (metasploit/target) -->
  <g transform="translate(192 128)">
    <circle r="30" fill="none" stroke="#f4f4f4" stroke-width="6"/>
    <circle r="17" fill="none" stroke="#f4f4f4" stroke-width="5" opacity="0.7"/>
    <circle r="6" fill="#ffffff"/>
  </g>
</svg>
