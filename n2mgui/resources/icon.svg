      <stop offset="0" stop-color="#2a1d10"/>
      <stop offset="1" stop-color="#140d07"/>
    </linearGradient>
    <linearGradient id="ar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb673"/>
      <stop offset="1" stop-color="#e0661a"/>
