  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#2a3850" stroke-width="1"/>

  <!-- Nodo origen (radar/nmap): círculo con barrido -->
